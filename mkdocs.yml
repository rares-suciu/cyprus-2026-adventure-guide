site_name: Cyprus 2026 – The Adventure Edition
site_description: A family travel guide for Cyprus, 26 October – 5 November 2026
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search
  - awesome-pages
  - glightbox
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
docs_dir: book
site_dir: website